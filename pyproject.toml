[project]
name = "multitool-rag-agent"
version = "0.1.0"
description = "Multi-tool RAG and conversational AI agents built with LangChain and LangGraph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-huggingface>=0.1.0",
    "langgraph>=0.2.0",
    "pypdf>=5.0.0",
    "sentence-transformers>=3.0.0",
    "python-dotenv>=1.0.0",
    "ipywidgets>=8.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
